<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Membership - Warriaga Park FC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Membership</h1>
        <nav><a href="index.html">Home</a></nav>
    </header>
    <main>
        <h2>Join the Club</h2>
        <form>
            <label>Full Name: <input type="text" name="name" required></label><br><br>
            <label>Email Address: <input type="email" name="email" required></label><br><br>
            <label>Phone Number: <input type="tel" name="phone"></label><br><br>
            <label>Date of Birth: <input type="date" name="dob"></label><br><br>
            <label>
                Membership Type:
                <select name="type">
                    <option value="adult">Adult - R200/year</option>
                    <option value="junior">Junior - R100/year</option>
                    <option value="family">Family - R350/year</option>
                </select>
            </label><br><br>
            <button type="submit">Submit Registration</button>
        </form>
    </main>
</body>
</html>
